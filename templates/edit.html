{% extends "base.html" %}
{% block title %}Edit announcement - Northvale University{% endblock %}

{% block content %}
<h1>Edit announcement</h1>

<form class="card form" method="post">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" maxlength="200"
           value="{{ announcement.title }}" required>

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="6" required>{{ announcement.content }}</textarea>

    <div class="actions">
        <button type="submit" class="button">Save changes</button>
        <a class="button secondary" href="{{ url_for('admin') }}">Cancel</a>
    </div>
</form>
{% endblock %}
